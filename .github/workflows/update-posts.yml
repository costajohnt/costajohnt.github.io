name: Update Blog Posts

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6 AM UTC
  workflow_dispatch: # Allow manual trigger
  repository_dispatch:
    types: [hashnode-post-published]

permissions:
  contents: write

jobs:
  update-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run tests
        run: node scripts/embed-data.test.mjs

      - name: Fetch latest posts from Hashnode
        run: node scripts/update-posts.mjs

      - name: Embed data into HTML
        run: node scripts/embed-data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json index.html contributions.html sitemap.xml
          if ! git diff --staged --quiet; then
            git commit -m "chore: update blog posts data"
            git pull --rebase
            git push
          fi

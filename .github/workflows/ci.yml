name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
      - run: npm ci
      - name: Syntax-check scripts
        run: |
          for f in scripts/*.mjs scripts/lib/*.mjs; do node --check "$f"; done
          python3 -m py_compile scripts/*.py
      - name: Run Python converter tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r scripts/requirements.txt
          .venv/bin/python scripts/test_md_to_prosemirror.py
      - name: Run tests
        run: npm test

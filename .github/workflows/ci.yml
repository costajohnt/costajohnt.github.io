name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Syntax-check scripts
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
      - name: Run tests
        run: node scripts/embed-data.test.mjs

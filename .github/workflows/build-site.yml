name: Build Site

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6 AM UTC
  workflow_dispatch:
  repository_dispatch:
    types: [oss-pr-merged]

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build post HTML pages
        run: node scripts/build-posts.mjs

      - name: Fetch OSS contribution stats
        run: node scripts/update-oss-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate RSS feed and sitemap
        run: node scripts/generate-feed.mjs

      - name: Embed data into HTML
        run: node scripts/embed-data.mjs

      # Tests must run AFTER the build steps: they validate data/*.json and
      # the embedded HTML, and the steps above rewrite those files. Running
      # tests first would only ever validate yesterday's committed data.
      - name: Validate regenerated data and HTML
        run: npm test

      - name: Commit and push if changed
        # Page list mirrors CHROME_PAGES in scripts/lib/pages.mjs (source of
        # truth); this is shell, so keep the copy in sync by hand.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ writing/ index.html about.html now.html contact.html testimonials.html contributions.html writing.html 404.html feed.xml sitemap.xml llms.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore: daily site build"
            # A Publish: push in the same window makes the rebase conflict on
            # generated files. Take this build's side (-X theirs = the commit
            # being replayed), then regenerate from the merged tree so the
            # feed/sitemap/listings include the newly published post, and fold
            # any drift into a second commit before pushing. Mirrors the retry
            # in scripts/publish-post.mjs.
            git pull --rebase -X theirs
            node scripts/build-posts.mjs
            node scripts/generate-feed.mjs
            node scripts/embed-data.mjs
            npm test
            git add data/ writing/ index.html about.html now.html contact.html testimonials.html contributions.html writing.html 404.html feed.xml sitemap.xml llms.txt
            if ! git diff --staged --quiet; then
              git commit -m "chore: daily site build (post-rebase regen)"
            fi
            git push
          fi

  # The bot push above uses GITHUB_TOKEN, which does not fire push-triggered
  # workflows — deploy explicitly so the daily refresh actually goes live.
  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>animations.js — Test Suite</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { padding: 2rem; font-family: var(--display); }
    .test-results { max-width: 700px; margin: 0 auto; }
    .test-group { margin-bottom: 2rem; }
    .test-group h2 { font-size: 1rem; margin-bottom: 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    .test { padding: 0.4rem 0; font-size: 0.85rem; display: flex; gap: 0.5rem; }
    .test-pass { color: var(--green); }
    .test-fail { color: #dc2626; }
    .test-icon { font-weight: bold; width: 1.5rem; }
    .summary { font-size: 1.1rem; font-weight: 600; margin-top: 2rem; padding: 1rem; border-radius: var(--radius); }
    .summary-pass { background: var(--green-soft); color: var(--green); }
    .summary-fail { background: #fef2f2; color: #dc2626; }
  </style>
</head>
<body>

  <!-- Minimal DOM fixtures for testing -->
  <div id="fixtures" style="display:none;">
    <span class="hero-line"><span class="hero-line-inner">Test</span></span>
    <p class="bio">Bio text</p>
    <div class="contrib-stats">
      <div class="contrib-stat"><div class="number accent-num" data-count="42">42</div><div class="label">Test</div></div>
      <div class="contrib-stat"><div class="number neutral-num" data-count="10" data-suffix="+">10+</div><div class="label">Test</div></div>
    </div>
    <div class="repo-grid">
      <a class="repo-chip">Chip 1</a>
      <a class="repo-chip">Chip 2</a>
    </div>
    <div class="values"><div class="value-card">Card</div></div>
    <div class="section-header">Header</div>
    <a class="oss-card">Project</a>
    <div class="testimonial-teaser">
      <blockquote>Quote</blockquote>
      <div class="testimonial-teaser-attr">Attr</div>
    </div>
  </div>

  <div class="test-results">
    <h1>animations.js Test Suite</h1>
    <div id="output"></div>
    <div id="summary"></div>
  </div>

  <script>
    // ── Test runner ──
    var results = [];
    var groups = {};

    function group(name) {
      groups[name] = groups[name] || [];
      return {
        test: function (desc, fn) {
          var passed = false;
          var error = '';
          try {
            passed = fn();
            if (passed === undefined) passed = true;
          } catch (e) {
            error = e.message;
          }
          var result = { desc: desc, passed: passed, error: error };
          groups[name].push(result);
          results.push(result);
        }
      };
    }

    function render() {
      var output = document.getElementById('output');
      output.textContent = '';

      for (var name in groups) {
        var section = document.createElement('div');
        section.className = 'test-group';

        var heading = document.createElement('h2');
        heading.textContent = name;
        section.appendChild(heading);

        groups[name].forEach(function (r) {
          var row = document.createElement('div');
          row.className = 'test ' + (r.passed ? 'test-pass' : 'test-fail');

          var icon = document.createElement('span');
          icon.className = 'test-icon';
          icon.textContent = r.passed ? 'PASS' : 'FAIL';
          row.appendChild(icon);

          var text = document.createElement('span');
          text.textContent = r.desc + (r.error ? ' -- ' + r.error : '');
          row.appendChild(text);

          section.appendChild(row);
        });

        output.appendChild(section);
      }

      var passed = results.filter(function (r) { return r.passed; }).length;
      var failed = results.length - passed;
      var summaryEl = document.getElementById('summary');
      summaryEl.className = 'summary ' + (failed === 0 ? 'summary-pass' : 'summary-fail');
      summaryEl.textContent = passed + ' passed, ' + failed + ' failed, ' + results.length + ' total';
    }

    // ══════════════════════════════════════════════
    // Tests: CDN dependency guard
    // ══════════════════════════════════════════════
    (function () {
      var g = group('CDN dependency guard');

      g.test('Guard logic correctly checks typeof globals', function () {
        var guardWorks = (typeof gsap === 'undefined') ||
                         (typeof ScrollTrigger === 'undefined') ||
                         (typeof Lenis === 'undefined');
        return typeof guardWorks === 'boolean';
      });

      g.test('Hero-line-inner has CSS transform: translateY(110%)', function () {
        var el = document.querySelector('.hero-line-inner');
        var style = window.getComputedStyle(el);
        return style.transform !== 'none';
      });
    })();

    // ══════════════════════════════════════════════
    // Tests: Source code structure (static analysis)
    // ══════════════════════════════════════════════
    (function () {
      var g = group('Source code structure');
      var sourceLoaded = false;
      var source = '';

      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'animations.js', false);
      xhr.send();
      if (xhr.status === 200) {
        source = xhr.responseText;
        sourceLoaded = true;
      }

      g.test('animations.js loads successfully', function () {
        return sourceLoaded && source.length > 0;
      });

      g.test('CDN guard is first executable statement', function () {
        var guardIdx = source.indexOf("typeof gsap === 'undefined'");
        var lenisIdx = source.indexOf('new Lenis');
        return guardIdx > 0 && guardIdx < lenisIdx;
      });

      g.test('Lenis init appears AFTER reduced-motion check', function () {
        var reducedIdx = source.indexOf('prefersReduced');
        var returnIdx = source.indexOf('return;');
        var lenisIdx = source.indexOf('new Lenis');
        return reducedIdx < returnIdx && returnIdx < lenisIdx;
      });

      g.test('parseInt uses radix 10', function () {
        return source.indexOf('parseInt(el.dataset.count, 10)') !== -1;
      });

      g.test('NaN guard on count-up target', function () {
        return source.indexOf('isNaN(target)') !== -1;
      });

      g.test('Count-up sets "0" inside onEnter (not eagerly)', function () {
        var onEnterIdx = source.indexOf('onEnter: function');
        var setZeroIdx = source.indexOf("el.textContent = '0'");
        return onEnterIdx > 0 && setZeroIdx > onEnterIdx;
      });

      g.test('Uses Object.assign instead of manual merge', function () {
        var hasAssign = source.indexOf('Object.assign({') !== -1;
        var hasManualMerge = source.indexOf('for (var k in defaults)') !== -1;
        return hasAssign && !hasManualMerge;
      });

      g.test('fadeUp has each:false in defaults', function () {
        return source.indexOf('each: false') !== -1;
      });

      g.test('No duplicate .oss-card forEach loop', function () {
        var matches = source.match(/\.oss-card/g);
        return matches && matches.length === 1;
      });

      g.test('No duplicate .testimonial-card forEach loop', function () {
        var forEachPattern = source.indexOf("'.testimonial-card').forEach");
        return forEachPattern === -1;
      });

      g.test('fadeUp has JSDoc comment', function () {
        return source.indexOf('@param {string} selector') !== -1;
      });

      g.test('Lenis-GSAP sync has explanatory comment', function () {
        return source.indexOf('expects milliseconds') !== -1;
      });

      g.test('window.lenis references index.html', function () {
        return source.indexOf('see inline script in index.html') !== -1;
      });

      g.test('PR batch comment explains rationale', function () {
        return source.indexOf('without creating excessive ScrollTrigger') !== -1;
      });

      g.test('Uses heroLines variable instead of re-querying selector', function () {
        var heroLinesDecl = source.indexOf("var heroLines = gsap.utils.toArray('.hero-line-inner')");
        var gsapToHeroLines = source.indexOf('gsap.to(heroLines,');
        return heroLinesDecl > 0 && gsapToHeroLines > heroLinesDecl;
      });
    })();

    // ══════════════════════════════════════════════
    // Tests: HTML structure
    // ══════════════════════════════════════════════
    (function () {
      var g = group('HTML structure (via source fetch)');
      var pages = ['index.html', 'about.html', 'contributions.html', 'testimonials.html'];

      pages.forEach(function (page) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', page, false);
        xhr.send();
        var html = xhr.responseText || '';

        g.test(page + ': no .rise classes remain', function () {
          return html.indexOf('class="rise') === -1;
        });

        g.test(page + ': has SRI integrity on GSAP script', function () {
          return html.indexOf('gsap.min.js" integrity="sha384-') !== -1;
        });

        g.test(page + ': has SRI integrity on ScrollTrigger script', function () {
          return html.indexOf('ScrollTrigger.min.js" integrity="sha384-') !== -1;
        });

        g.test(page + ': has SRI integrity on Lenis script', function () {
          return html.indexOf('lenis.min.js" integrity="sha384-') !== -1;
        });

        g.test(page + ': has crossorigin="anonymous" on CDN scripts', function () {
          return html.indexOf('crossorigin="anonymous"') !== -1;
        });

        g.test(page + ': loads animations.js', function () {
          return html.indexOf('src="animations.js"') !== -1;
        });

        g.test(page + ': no scroll-behavior: smooth', function () {
          return html.indexOf('scroll-behavior') === -1;
        });
      });

      // index.html specific
      var xhr2 = new XMLHttpRequest();
      xhr2.open('GET', 'index.html', false);
      xhr2.send();
      var indexHtml = xhr2.responseText || '';

      g.test('index.html: has hero-line structure', function () {
        return indexHtml.indexOf('class="hero-line"') !== -1 &&
               indexHtml.indexOf('class="hero-line-inner"') !== -1;
      });

      g.test('index.html: has noscript fallback for hero', function () {
        return indexHtml.indexOf('<noscript><style>.hero-line-inner') !== -1;
      });

      g.test('index.html: stats have data-count attributes', function () {
        return indexHtml.indexOf('data-count="') !== -1;
      });

      g.test('index.html: stats have data-suffix on 20+', function () {
        return indexHtml.indexOf('data-suffix="+"') !== -1;
      });

      g.test('index.html: hamburger has lenis.stop()', function () {
        return indexHtml.indexOf('window.lenis.stop()') !== -1;
      });

      g.test('index.html: hamburger has lenis.start()', function () {
        return indexHtml.indexOf('window.lenis.start()') !== -1;
      });
    })();

    // ══════════════════════════════════════════════
    // Tests: CSS structure
    // ══════════════════════════════════════════════
    (function () {
      var g = group('CSS structure');
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'styles.css', false);
      xhr.send();
      var css = xhr.responseText || '';

      g.test('No @keyframes rise in CSS', function () {
        return css.indexOf('@keyframes rise') === -1;
      });

      g.test('No .rise class in CSS', function () {
        return css.indexOf('.rise {') === -1;
      });

      g.test('No .d1-.d6 delay classes in CSS', function () {
        return css.indexOf('.d1 {') === -1 && css.indexOf('.d6 {') === -1;
      });

      g.test('No scroll-behavior: smooth in CSS', function () {
        return css.indexOf('scroll-behavior') === -1;
      });

      g.test('.hero-line has overflow: hidden', function () {
        return css.indexOf('.hero-line') !== -1 && css.indexOf('overflow: hidden') !== -1;
      });

      g.test('.hero-line-inner has translateY(110%)', function () {
        return css.indexOf('translateY(110%)') !== -1;
      });

      g.test('.hero-line-inner has descender comment', function () {
        return css.indexOf('descenders') !== -1;
      });
    })();

    // ══════════════════════════════════════════════
    // Tests: Accessibility
    // ══════════════════════════════════════════════
    (function () {
      var g = group('Accessibility');
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'animations.js', false);
      xhr.send();
      var source = xhr.responseText || '';

      g.test('Reduced-motion check uses matchMedia', function () {
        return source.indexOf("matchMedia('(prefers-reduced-motion: reduce)')") !== -1;
      });

      g.test('Reduced-motion branch returns before Lenis init', function () {
        var firstReturn = source.indexOf('return;');
        var lenisNew = source.indexOf('new Lenis');
        return firstReturn > 0 && firstReturn < lenisNew;
      });

      g.test('Reduced-motion resets hero-line-inner', function () {
        var reducedBlock = source.substring(
          source.indexOf('prefersReduced'),
          source.indexOf('new Lenis')
        );
        return reducedBlock.indexOf("'.hero-line-inner'") !== -1;
      });

      g.test('All ScrollTriggers use once: true (no repeated triggers)', function () {
        var onceCount = (source.match(/once: true/g) || []).length;
        return onceCount >= 5;
      });
    })();

    // Render results
    render();
  </script>
</body>
</html>
